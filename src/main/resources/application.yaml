server:
  address: 127.0.0.1
  port: ${PORT:8080}
spring:
  application:
    name: mysql-index-lab
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3307/index_lab?rewriteBatchedStatements=true}
    username: ${DB_USER:lab}
    password: ${DB_PASSWORD:lab_local_password}
  sql:
    init:
      mode: always
  graphql:
    graphiql:
      enabled: true
