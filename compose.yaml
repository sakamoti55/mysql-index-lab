name: mysql-index-lab
services:
  mysql:
    image: mysql:8.4
    ports:
      - "127.0.0.1:3307:3306"
    environment:
      MYSQL_DATABASE: index_lab
      MYSQL_USER: lab
      MYSQL_PASSWORD: lab_local_password
      MYSQL_ROOT_PASSWORD: root_local_password
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 20s
volumes:
  mysql-data:
